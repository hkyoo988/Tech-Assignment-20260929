spring:
  datasource:
    url: jdbc:mysql://localhost:3306/chat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: chat
    password: chat
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC   # 시간은 전부 UTC로 저장 (서버 시각 기준 정렬이 흔들리지 않게)
  flyway:
    enabled: true
  task:
    execution:
      pool:
        queue-capacity: 1000   # 대기열에 상한을 둠

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
     level:
       org.hibernate.SQL: debug
       org.hibernate.orm.jdbc.bind: trace

chat:
  snapshot:
    interval: 100
